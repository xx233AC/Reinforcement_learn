[project]
name = "reinforcement-learn"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "axin233", email = "axin233rel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "torch>=2.13.0",
    "cloudpickle==3.1.2",
    "farama-notifications==0.0.6",
    "gymnasium==1.3.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "transformers>=5.16.1",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.14.0",
    "pyarrow>=25.0.1",
]

[project.scripts]
reinforcement-learn = "reinforcement_learn:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
